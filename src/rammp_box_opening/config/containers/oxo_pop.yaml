# OXO POP container model. Owner accepted nominal values for the press
# demo 2026-08-25 (tag.size_m measured; dims/button_offset/travel_m are
# NOMINAL — safe because the press target comes from the live tag, not
# config, and the torque guard stops the stroke). Refine at the bench:
# a caliper on the button travel is still worth 2 minutes.
measure_me: false

dims: [0.075, 0.075, 0.107]       # z DERIVED from the live tag height
                                  # 2026-08-25 (tag z 0.080 - table -0.027);
                                  # xy still nominal — tape when convenient
lid_dims: [0.075, 0.075, 0.03]
button_offset: [0.0, 0.0, 0.107]  # tag sits on the button = container top
press:
  depth_window: [0.004, 0.012]    # m below nominal button top (min=real press,
  touch_nm: 8.0                   #  max includes cancel-latency budget, spec §6)
                                  # 3.0 stopped before the seal released (owner
                                  # 2026-08-25); 6.0 worked at the OLD 0.1 s
                                  # executor poll, whose sluggish cancel gave
                                  # the stroke mm of overtravel past the trip.
                                  # At the 0.02 s poll the stop is crisp and a
                                  # 6.1 Nm trip no longer released the seal
                                  # (field 2026-09-01) — 8.0 presses through.
press_attitude_rpy_deg: [180.0, 0.0, 0.0]   # top-down; yaw steered per pose
lid_grasp:
  offset: [0.0, 0.0, 0.15]        # rim grasp point
  width_m: 0.02
  expect_band: [0.55, 0.75]       # gripper position feedback = holding lid
  attitude_rpy_deg: [180.0, 0.0, 0.0]
body_grasp:
  offset: [0.0, 0.0, 0.08]
  width_m: 0.072
  expect_band: [0.10, 0.60]
  attitude_rpy_deg: [180.0, 0.0, 0.0]
hover_standoff: 0.08              # m above target; must clear guards.min_standoff
gripper_map:
  aperture_at_0: 0.085            # bench-calibrated two-point width->command map
  aperture_at_08: 0.0
bench_pose:                       # Phase-1 PoseSource (hand-measured)
  xyz: [0.45, 0.0, -0.027]        # z = measured table top (world_bench.yaml)
  yaw_deg: 0.0
open_container:
  lid_place:                      # the one non-container-derived pose (spec §5)
    xyz: [0.45, -0.25, -0.027]
    yaw_deg: 0.0

# --- open_box (step 2, owner 2026-08-26): pull the lid off ---------------
open_box:
  grip_band: [0.30, 0.55]         # close feedback = HOLDING the popped
                                  # button. Bench-measured 2026-08-26:
                                  # 0.387 gripping the knob. Below lo =
                                  # closed on something too wide (the box
                                  # itself reads ~0.09); 0.8 = air
  lift_m: 0.15                    # slow pull height before the carry
  lift_speed: 0.35                # visibly gentle pull, 2.3x faster than the
                                  # 0.15 it shipped at (speed pass 2026-08-28).
                                  # Unguarded, so runner._refusal exempts
                                  # "lift" alongside "retreat".
  grip_hop_m: 0.05                # how far ABOVE the tag plane the press
                                  # retreat stops before the fingers open and
                                  # re-descend. Was staging_m (0.12), making a
                                  # 253 mm rise-and-fall for a 2 mm reposition.
                                  # 0.05 clears the err-tall container cuboid
                                  # (top sits ~20 mm above the plane) and still
                                  # leaves the fingers room to swing open over
                                  # the popped knob. Only interaction-world
                                  # legs plan from this height — press-only
                                  # keeps the full retreat, because its home
                                  # is planned in the FULL world where the
                                  # finger spheres need ~0.10 m of clearance.
  grip_speed: 0.15                # descent onto the popped button. NOT yet
                                  # raised: a trip here means FAILURE and the
                                  # stop height is 2 mm above the lid, vs
                                  # POSE_UNCERTAINTY_M 0.02. Ramp at the bench
                                  # 0.15 -> 0.25 -> 0.35, three descents each,
                                  # watching torque_peak in the run jsonl.
  merge_press: true               # ONE continuous motion from the scan pose
                                  # straight to the button, replacing
                                  # [transit to staging] STOP [press down].
                                  # No seam and no splice: a single cuRobo
                                  # solve is continuous by construction, and
                                  # the warp below supplies the slow-into-
                                  # contact profile. Only legal because the
                                  # servo leaves the arm ALREADY ABOVE the
                                  # tag — the descent is near-vertical, so
                                  # the container being unmodelled above the
                                  # reduction plane costs no real clearance.
                                  # Guarded by merge_press_max_lateral_m.
  merge_press_max_lateral_m: 0.20 # refuse the merge (and fall back to the
                                  # two-leg path) when the scan pose is
                                  # further than this from the button in xy.
                                  # Why 0.20 is defensible (field 2026-09-01,
                                  # a real box sat 152 mm off-axis): the
                                  # descent converges over the button as it
                                  # falls — by container-top height only ~9%
                                  # of the initial offset remains (<2 cm at
                                  # 0.20), the warp has it at press speed
                                  # well before box height, and the guard is
                                  # armed the whole way, so an edge strike
                                  # trips as an honest early-contact failure.
                                  # The merged solve still plans in the
                                  # reduced world; past 0.20 the lateral run
                                  # through it is too long — staged fallback.
  warp_fast_speed: 0.5            # free-air portion of a GUARDED descent.
                                  # A guarded leg used one scale for its whole
                                  # length, so grip:down crawled 118 mm at 0.15
                                  # (4.16 s) when only the last stretch is near
                                  # anything. Positions are unchanged by the
                                  # warp and every scale stays <= 1.0, so no
                                  # executed velocity exceeds what cuRobo
                                  # already limit-checked. The guard stays
                                  # armed throughout and re-baselines at the
                                  # transition. 0 disables warping entirely.
  warp_slow_frac: 0.30            # final fraction of the PATH at contact speed
  setdown_speed: 0.35             # guarded set-down; a trip IS the success
                                  # here, and the guard arms in 1.7 mm once
                                  # the executor polls at 0.02 s
  grip_clear_m: 0.002             # fingertip stop height ABOVE the tag
                                  # plane. The tag plane IS the lid top
                                  # (tag on the flush button at scan): the
                                  # popped-up button is grabbed at its
                                  # BASE — press depth is 15 mm INTO the
                                  # lid and trips the guard (field
                                  # 2026-08-26, first grip attempt)
  grip_offset_xy: [-0.003, 0.0]   # base-frame grasp trim: first grip
                                  # landed ~3 mm too far +x (measured
                                  # 2026-08-26); at 85 mm aperture around
                                  # a 75 mm box there is only 5 mm of
                                  # side clearance — this trim matters

# --- press_demo (tag-driven press flow, owner design 2026-08-24) ---------
tag:                              # printed marker on the button top
  id: 0                           # DICT_4X4_50 (docs/tag0_50mm.png)
  size_m: 0.03                    # 30 mm file (docs/tag0_30mm.png) — the
                                  # printer rescales: MEASURE the print and
                                  # correct this (last print came out 1.2x)
  offset_xyz: [0.0, 0.0, 0.0]     # tag center -> button top center, container
                                  # frame (0 = tag stuck ON the button)
press_demo:
  travel_m: 0.015                 # owner 2026-08-26 (third bump; the guard
                                  # at 6 Nm remains the force ceiling)
  speed: 0.35                     # press stroke speed (owner 2026-08-25)
  staging_m: 0.12                 # full-world approach height above the tag.
                                  # EMPIRICAL 2026-08-25: 0.08 was IK_FAIL
                                  # live (finger spheres + err-tall + padding
                                  # eat ~0.10); 0.10 is the measured boundary
scan:
  xyz: [0.42, 0.0, 0.45]          # tool-down look pose; camera sees ~0.6 x
                                  # 0.4 m of bench around it at tag height
vlm:                              # detect.source: vlm — the semantic gate
  model: claude-opus-5            # measured 2026-09-01: 3.3 s, box dead-on;
                                  # claude-haiku-4-5 was 0.4 s faster and
                                  # boxed the ROBOT'S OWN BASE. Fast loses.
  target: the OXO POP food-storage container — a square white plastic container with a rounded-square white lid
  timeout_s: 20.0                 # API budget; past it the mission falls
                                  # back to plain depth, never stalls
  pad_px: 20                      # bbox padding before it gates the depth
detect:
  source: vlm                     # vlm | depth | tag. vlm = ONE Claude call
                                  # picks WHICH surface is the container
                                  # (bbox), then the depth plateau inside it
                                  # supplies the mm geometry; every depth
                                  # honesty gate still stands, and any VLM
                                  # failure falls back to depth. depth = the
                                  # geometry alone (refuses when ambiguous).
                                  # tag = the retired ArUco path (A/B only).
                                  # Old comment for depth/tag context:
                                  # geometry (lid plateau above the measured
                                  # table) — no print to wear out; the press
                                  # knuckles destroyed two tag prints in a
                                  # week (field 2026-09-01). tag = the ArUco
                                  # path, kept for A/B and for containers
                                  # too flat for the height band.
  timeout_s: 10.0                 # scan-pose wait for a stable fix
  min_hits: 3                     # agreeing frames before the fix commits
  tol_m: 0.03                     # pairwise agreement (stable_fix)
  window_s: 2.0                   # sightings older than this leave the window
  fresh_s: 1.0                    # a fix older than this cannot commit
  period_s: 0.05                  # detector tick. min_hits * period is the
                                  # hard floor on time-to-commit: 0.15 s here
                                  # vs 0.45 s at the 0.15 s default. Not the
                                  # camera's 0.033 s: this tick shares the
                                  # single-threaded spin that polls the torque
                                  # guard, so 20 Hz buys most of the win
                                  # without tripling the load during contact.
servo:                            # center-the-tag loop (owner 2026-08-25):
  tol_px: 40.0                    # ~1.8 cm at scan range: one servo move
                                  # usually suffices; the close-range re-fix
                                  # absorbs the residual (owner: fewer pauses)
  max_iters: 0                    # lateral looks before pressing on anyway.
                                  # 0 = detect once and press on that fix.
                                  # Measured over the live runs: iteration 0
                                  # committed 5/5, iteration 1 only 1/4 — the
                                  # re-acquisition after the servo move was
                                  # the demo's single biggest failure source
                                  # (three 10 s no-tag aborts). The
                                  # close-range re-fix at staging already
                                  # absorbs the lateral residual.
  min_step_m: 0.01                # skip micro-moves (kortex small-goal lore)
  max_step_m: 0.25                # clamp one servo translation
