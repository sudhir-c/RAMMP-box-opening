# OXO POP container model. Owner accepted nominal values for the press
# demo 2026-08-25 (tag.size_m measured; dims/button_offset/travel_m are
# NOMINAL — safe because the press target comes from the live tag, not
# config, and the torque guard stops the stroke). Refine at the bench:
# a caliper on the button travel is still worth 2 minutes.
measure_me: false

dims: [0.075, 0.075, 0.107]       # z DERIVED from the live tag height
                                  # 2026-08-25 (tag z 0.080 - table -0.027);
                                  # xy still nominal — tape when convenient
lid_dims: [0.075, 0.075, 0.03]
button_offset: [0.0, 0.0, 0.107]  # tag sits on the button = container top
press:
  depth_window: [0.004, 0.012]    # m below nominal button top (min=real press,
  touch_nm: 6.0                   #  max includes cancel-latency budget, spec §6)
                                  # 6.0: the 3.0 trip stopped the stroke before
                                  # the OXO seal released (owner 2026-08-25)
press_attitude_rpy_deg: [180.0, 0.0, 0.0]   # top-down; yaw steered per pose
lid_grasp:
  offset: [0.0, 0.0, 0.15]        # rim grasp point
  width_m: 0.02
  expect_band: [0.55, 0.75]       # gripper position feedback = holding lid
  attitude_rpy_deg: [180.0, 0.0, 0.0]
body_grasp:
  offset: [0.0, 0.0, 0.08]
  width_m: 0.072
  expect_band: [0.10, 0.60]
  attitude_rpy_deg: [180.0, 0.0, 0.0]
hover_standoff: 0.08              # m above target; must clear guards.min_standoff
gripper_map:
  aperture_at_0: 0.085            # bench-calibrated two-point width->command map
  aperture_at_08: 0.0
bench_pose:                       # Phase-1 PoseSource (hand-measured)
  xyz: [0.45, 0.0, -0.027]        # z = measured table top (world_bench.yaml)
  yaw_deg: 0.0
open_container:
  lid_place:                      # the one non-container-derived pose (spec §5)
    xyz: [0.45, -0.25, -0.027]
    yaw_deg: 0.0

# --- open_box (step 2, owner 2026-08-26): pull the lid off ---------------
open_box:
  grip_band: [0.40, 0.75]         # close feedback = HOLDING the popped
                                  # button (0.8 = closed on air; TUNE at
                                  # bench on the first grip)
  lift_m: 0.15                    # slow pull height before the carry
  lift_speed: 0.15                # "slowly lift upwards" (owner)

# --- press_demo (tag-driven press flow, owner design 2026-08-24) ---------
tag:                              # printed marker on the button top
  id: 0                           # DICT_4X4_50 (docs/tag0_50mm.png)
  size_m: 0.03                    # 30 mm file (docs/tag0_30mm.png) — the
                                  # printer rescales: MEASURE the print and
                                  # correct this (last print came out 1.2x)
  offset_xyz: [0.0, 0.0, 0.0]     # tag center -> button top center, container
                                  # frame (0 = tag stuck ON the button)
press_demo:
  travel_m: 0.015                 # owner 2026-08-26 (third bump; the guard
                                  # at 6 Nm remains the force ceiling)
  speed: 0.35                     # press stroke speed (owner 2026-08-25)
  staging_m: 0.12                 # full-world approach height above the tag.
                                  # EMPIRICAL 2026-08-25: 0.08 was IK_FAIL
                                  # live (finger spheres + err-tall + padding
                                  # eat ~0.10); 0.10 is the measured boundary
scan:
  xyz: [0.42, 0.0, 0.45]          # tool-down look pose; camera sees ~0.6 x
                                  # 0.4 m of bench around it at tag height
detect:
  timeout_s: 10.0                 # scan-pose wait for a stable fix
  min_hits: 3                     # agreeing frames before the fix commits
  tol_m: 0.03                     # pairwise agreement (stable_fix)
  window_s: 2.0                   # sightings older than this leave the window
  fresh_s: 1.0                    # a fix older than this cannot commit
servo:                            # center-the-tag loop (owner 2026-08-25):
  tol_px: 40.0                    # ~1.8 cm at scan range: one servo move
                                  # usually suffices; the close-range re-fix
                                  # absorbs the residual (owner: fewer pauses)
  max_iters: 4                    # lateral looks before pressing on anyway
  min_step_m: 0.01                # skip micro-moves (kortex small-goal lore)
  max_step_m: 0.25                # clamp one servo translation
